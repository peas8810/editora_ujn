<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f6ef">
  <link rel="icon" href="../../assets/ujn-logo.png">
  <link rel="stylesheet" href="../style.css?v=obras">
  <title>Área administrativa | Editora UJN</title>
</head>
<body>
  <header class="masthead"><div class="shell top"><a class="brand" href="../"><img class="brand-logo" src="../../assets/ujn-logo.png" alt="" width="48" height="48"><span>Editora UJN</span></a><a class="outline" href="../">Voltar ao catálogo</a></div></header>
  <main class="shell access">
    <p class="eyebrow"><span></span> Editora UJN</p>
    <h2>Área administrativa</h2>
    <p>Use a conta Google responsável para cadastrar a obra, enviar o PDF e acompanhar a publicação.</p>
    <a class="primary" id="open-panel" hidden>Abrir painel editorial</a>
    <p id="panel-status" role="status">Verificando disponibilidade do painel…</p>
  </main>
  <script type="module">
    const status = document.getElementById('panel-status');
    try {
      const response = await fetch('../config.json', { cache: 'no-store' });
      if (!response.ok) throw new Error();
      const { appsScriptUrl } = await response.json();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(appsScriptUrl)) throw new Error();
      const link = document.getElementById('open-panel');
      link.href = appsScriptUrl;
      link.hidden = false;
      status.hidden = true;
    } catch {
      status.textContent = 'O painel de envio ainda aguarda a ativação da conta Google responsável.';
    }
  </script>
</body>
</html>
