<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <title>Área administrativa | Editora UJN</title>
  <script type="module">
    import { endpoint } from "../config.js";
    try {
      const url = await endpoint("../config.json");
      if (url) document.getElementById("enter").hidden = false;
      if (url) document.getElementById("enter").href = url.href;
      document.getElementById("message").textContent = url
        ? "Use o painel para cadastrar, editar e publicar obras no catálogo."
        : "A integração com o Google Drive está em configuração.";
    } catch {
      document.getElementById("message").textContent = "Não foi possível carregar a configuração do painel.";
    }
  </script>
</head>
<body>
  <header class="masthead"><div class="shell top"><a class="brand" href="../"><span class="monogram" aria-hidden="true">U.</span><span>Editora UJN</span></a><a class="outline" href="../">Voltar ao catálogo</a></div></header>
  <main class="shell access">
    <p class="eyebrow"><span></span> Editora UJN</p>
    <h2>Área administrativa</h2>
    <p id="message" role="status">Verificando disponibilidade do painel…</p>
    <a id="enter" class="primary" hidden>Abrir painel <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
