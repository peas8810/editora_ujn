<!doctype html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:light;--navy:#123a66;--navy-dark:#0b2746;--orange:#fb8009;--paper:#f8f6ef;--card:#fffdf8;--ink:#1a2a3b;--muted:#526174;--line:#d8d9d4;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
    *,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}
    header{background:var(--card);border-top:3px solid var(--navy);border-bottom:1px solid var(--line);padding:14px max(18px,calc((100% - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
    a{color:var(--navy);text-underline-offset:4px} header strong{display:flex;gap:10px;align-items:center;color:var(--navy-dark);font:1.55rem Georgia,serif;white-space:nowrap}header img{width:42px;height:42px;object-fit:contain}
    main{width:min(1050px,calc(100% - 32px));margin:30px auto 60px}
    section,.panel{padding:clamp(16px,4vw,30px);background:var(--card);border:1px solid var(--line);border-radius:8px}
    #login{max-width:470px;margin:54px auto;border-top:2px solid var(--orange)} h1,h2,h3,p{margin:0} h1,h2{color:var(--navy-dark);font-family:Georgia,serif;font-weight:400;line-height:1.05}h1{font-size:clamp(2rem,5vw,3rem)}h2{font-size:1.7rem}
    p,small{color:var(--muted)} .subtitle{margin-top:9px;margin-bottom:16px}
    form{display:grid;gap:15px} label{display:grid;gap:4px;font-size:.88rem;font-weight:650;min-width:0}
    input,button,textarea,select{font:inherit;color:inherit}input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:white} textarea{resize:vertical}
    button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:4px;font-weight:650;cursor:pointer}
    button:hover{border-color:var(--navy)}button:disabled{opacity:.65;cursor:wait}
    .primary{background:var(--navy);border-color:var(--navy);color:#fff}.primary:hover{background:var(--navy-dark)}
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}
    .panel + .panel{margin-top:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}
    .records{display:grid;gap:8px}.record{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;align-items:end;gap:8px}
    #status{min-height:1.5em;margin:0 auto 12px;max-width:1050px;color:var(--navy);font-weight:600}
    .entry{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry h3{font-size:1rem}
    #entries{margin-top:13px}.checkbox{display:flex;align-items:flex-start;gap:8px}.checkbox input{width:auto;margin-top:5px}
    @media(max-width:660px){.grid,.record{grid-template-columns:1fr}.entry{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <header><strong><img src="https://publisherujn.com/assets/ujn-logo.png" alt="" width="42" height="42">Editora UJN</strong><a href="https://publisherujn.com/editora/">Voltar ao catálogo</a></header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="panel">
      <div class="bar"><h1>Painel editorial</h1><div class="actions"><button id="reload" type="button">Atualizar</button><button class="primary" id="new-book" type="button" disabled>Nova obra</button></div></div>
      <div id="entries"></div>
    </section>
    <section class="panel" id="editor" hidden>
      <h2 id="editor-title">Nova obra</h2>
      <p class="subtitle">Preencha a ficha e anexe o PDF. O painel gera o link da página a partir do ISBN.</p>
      <form id="book-form">
        <input name="revision" type="hidden"><input name="records" type="hidden">
        <div class="grid">
          <label>ISBN<input name="isbn" maxlength="32" required></label>
          <label>Título<input name="title" maxlength="250" required></label>
          <label>Autoria ou organização<input name="authors" maxlength="1000"></label>
          <label>Edição<input name="edition" maxlength="80"></label>
          <label>Formato<input name="format" maxlength="80" list="formats"></label>
          <datalist id="formats"><option>PDF</option><option>E-book</option><option>Impresso</option></datalist>
          <label>Categoria<input name="category" maxlength="120"></label>
          <label>Ano<input name="year" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label>
          <label>Páginas<input name="pages" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5"></label>
          <label class="wide">Sinopse<textarea name="description" maxlength="10000" rows="4"></textarea></label>
          <label>Livro em PDF (até 20 MB)<input name="documentFile" type="file" accept="application/pdf,.pdf"></label>
          <label>Capa em JPG, PNG ou WebP (até 4 MB)<input name="coverFile" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"></label>
          <div class="wide actions" id="current-links"></div>
          <label>Link oficial do ISBN<input name="isbnUrl" type="url" maxlength="2048"></label>
          <label>Situação editorial<select name="status"><option value="Rascunho">Rascunho</option><option value="Publicado">Publicado</option></select></label>
        </div>
        <div class="records"><h3>Registros complementares</h3><div class="records" id="records"></div><div><button id="add-record" type="button">Adicionar registro</button></div></div>
        <label id="consent" class="checkbox" hidden><input name="publicationConsent" type="checkbox" value="yes"> Autorizo a divulgação da ficha e dos arquivos desta obra.</label>
        <div class="actions"><button class="primary" id="save" type="submit">Salvar rascunho</button><button id="cancel" type="button">Cancelar</button></div>
      </form>
    </section>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const form = byId('book-form');
    const records = byId('records');
    const field = name => form.elements.namedItem(name);
    let loaded = false;
    let busy = false;
    let hasPdf = false;

    function setStatus(message) {
      byId('status').textContent = message;
    }

    function setBusy(value) {
      busy = value;
      document.querySelectorAll('button').forEach(button => { button.disabled = value; });
      byId('new-book').disabled = value || !loaded;
    }

    function run(method, args, message, success) {
      if (busy) return;
      setBusy(true);
      setStatus(message);
      google.script.run.withFailureHandler(error => {
        setBusy(false);
        setStatus(error?.message?.replace(/^Error: /, '') || 'Não foi possível concluir a operação.');
      }).withSuccessHandler(result => {
        setBusy(false);
        success(result);
      })[method](...args);
    }

    function create(tag, text) {
      const element = document.createElement(tag);
      if (text) element.textContent = text;
      return element;
    }

    function action(text, onClick) {
      const button = create('button', text);
      button.type = 'button';
      button.addEventListener('click', onClick);
      return button;
    }

    function render(books) {
      loaded = true;
      setBusy(false);
      const list = byId('entries');
      list.replaceChildren();
      if (!books.length) list.append(create('p', 'Nenhuma obra cadastrada.'));
      for (const book of books) {
        const entry = create('article');
        entry.className = 'entry';
        const info = create('div');
        const details = [book.isbn || 'ISBN inválido', book.authors, book.status].filter(Boolean).join(' · ');
        info.append(create('h3', book.title || 'Sem título'), create('p', details));
        entry.append(info);
        if (book.isbn) entry.append(action('Editar', () => openEditor(book)));
        list.append(entry);
      }
    }

    function addRecord(record = {}) {
      const row = create('div');
      row.className = 'record';
      const fields = [
        ['Tipo de registro', 'label', 'text', 100],
        ['Código', 'code', 'text', 250],
        ['Link oficial do registro', 'url', 'url', 2048],
        ['Link do documento público', 'documentUrl', 'url', 2048]
      ];
      for (const [label, name, type, limit] of fields) {
        const wrapper = create('label', label);
        const input = create('input');
        input.dataset.recordField = name;
        input.type = type;
        input.maxLength = limit;
        input.value = record[name] || '';
        wrapper.append(input);
        row.append(wrapper);
      }
      row.append(action('Remover registro', () => row.remove()));
      records.append(row);
      return row;
    }

    function updateStatusFields() {
      const published = field('status').value === 'Publicado';
      byId('consent').hidden = !published;
      field('publicationConsent').required = published;
      field('documentFile').required = published && !hasPdf;
      byId('save').textContent = published ? 'Salvar e publicar' : 'Salvar rascunho';
    }

    function link(label, value, host) {
      try {
        const url = new URL(value);
        if (url.protocol !== 'https:' || url.hostname !== host || url.username || url.password) return null;
        const anchor = create('a', label);
        anchor.href = url.href;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        return anchor;
      } catch {
        return null;
      }
    }

    function openEditor(book) {
      form.reset();
      records.replaceChildren();
      field('isbn').readOnly = Boolean(book);
      field('revision').value = book?.revision || '';
      for (const name of ['isbn', 'title', 'authors', 'edition', 'format', 'category', 'year', 'pages', 'description', 'isbnUrl']) {
        field(name).value = book?.[name] ?? '';
      }
      field('status').value = /^publicad[oa]$/i.test(book?.status?.trim() || '') ? 'Publicado' : 'Rascunho';
      const pdf = link('Abrir PDF atual', book?.documentUrl, 'drive.google.com');
      const cover = link('Abrir capa atual', book?.coverUrl, 'drive.google.com');
      const page = book && field('status').value === 'Publicado'
        ? link('Abrir página pública', 'https://publisherujn.com/editora/livro/?isbn=' + book.isbn, 'publisherujn.com') : null;
      byId('current-links').replaceChildren(...[pdf, cover, page].filter(Boolean));
      hasPdf = Boolean(pdf);
      book?.records.forEach(addRecord);
      updateStatusFields();
      byId('editor-title').textContent = book ? 'Editar obra' : 'Nova obra';
      byId('editor').hidden = false;
      field(book ? 'title' : 'isbn').focus();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      for (const [name, maximum] of [['documentFile', 20], ['coverFile', 4]]) {
        if (field(name).files[0]?.size > maximum * 1024 * 1024) {
          setStatus('O arquivo excede o limite de ' + maximum + ' MB.');
          return;
        }
      }
      field('records').value = JSON.stringify([...records.children].map(row =>
        Object.fromEntries([...row.querySelectorAll('input')].map(input => [input.dataset.recordField, input.value.trim()]))
      ));
      const published = field('status').value === 'Publicado';
      run('saveBook', [form], 'Enviando arquivos e salvando a ficha…', books => {
        form.reset();
        byId('editor').hidden = true;
        render(books);
        setStatus(published
          ? 'Ficha salva e marcada como publicada. A página ficará disponível após a próxima sincronização.'
          : 'Rascunho salvo. O catálogo será atualizado na próxima sincronização.');
        byId('new-book').focus();
      });
    });

    function reload() {
      run('listBooks', [], 'Carregando as obras…', books => {
        render(books);
        setStatus('');
      });
    }

    field('status').addEventListener('change', updateStatusFields);
    byId('new-book').addEventListener('click', () => openEditor());
    byId('add-record').addEventListener('click', () => addRecord().querySelector('input').focus());
    byId('cancel').addEventListener('click', () => { byId('editor').hidden = true; form.reset(); byId('new-book').focus(); });
    byId('reload').addEventListener('click', reload);
    reload();
  </script>
</body>
</html>
